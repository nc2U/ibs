name: "[Prod] Flutter App Distribution"

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play 출시 트랙 (internal: 내부테스트, production: 프로덕션)'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - production
      release_note:
        description: '배포 릴리즈 노트 (선택 사항)'
        required: false
        default: 'IBS 웍스 최신 정식 버전 배포'

concurrency:
  group: flutter-prod-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy-android:
    name: Build & Deploy Android (Google Play)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Flutter Environment & Secrets
        working-directory: app/flutter
        run: |
          echo "${{ secrets.FLUTTER_ENV_PROD }}" > .env
          python3 setup_env.py

      - name: Setup Android Keystore & Signing
        working-directory: app/flutter/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/upload-keystore.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          cat <<EOF > key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$KEYSTORE_PATH
          EOF

      - name: Install Dependencies
        working-directory: app/flutter
        run: flutter pub get

      - name: Build Android App Bundle
        working-directory: app/flutter
        run: flutter build appbundle --release --build-number=${{ github.run_number }} --dart-define=BASE_URL=https://ibs.dyibs.com

      - name: Prepare Release Notes
        run: |
          mkdir -p app/flutter/distribution/whatsnew
          echo "${{ inputs.release_note || 'IBS 웍스 최신 정식 버전 배포' }}" > app/flutter/distribution/whatsnew/whatsnew-ko-KR

      - name: Deploy to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.dyibs.mobileibs
          releaseFiles: app/flutter/build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: completed
          whatsNewDirectory: app/flutter/distribution/whatsnew

  build-and-deploy-ios:
    name: Build & Deploy iOS (Prod)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Flutter Environment & Secrets
        working-directory: app/flutter
        run: |
          echo "${{ secrets.FLUTTER_ENV_PROD }}" > .env
          python3 setup_env.py

      - name: Install Dependencies & Pods
        working-directory: app/flutter
        run: |
          flutter pub get
          flutter build ios --config-only --no-codesign
          cd ios
          pod install --repo-update
          cd ..

      - name: Setup iOS Provisioning Profile & Certificate
        if: ${{ env.BUILD_CERTIFICATE_BASE64 != '' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # 1. 임시 키체인 생성
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # 2. 인증서(.p12) 등록
          CERT_PATH=$RUNNER_TEMP/build_cert.p12
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERT_PATH
          security import $CERT_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # 3. 프로비저닝 프로필 등록
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo -n "$PROVISION_PROFILE_BASE64" | base64 --decode -o ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Build iOS IPA
        working-directory: app/flutter
        run: |
          flutter build ipa --release --no-codesign --build-number=${{ github.run_number }} --dart-define=BASE_URL=https://ibs.dyibs.com || flutter build ios --release --no-codesign --build-number=${{ github.run_number }} --dart-define=BASE_URL=https://ibs.dyibs.com

      - name: Deploy to Firebase App Distribution (iOS)
        if: ${{ env.FIREBASE_IOS_APP_ID != '' && env.APPLE_CERTIFICATE_BASE64 != '' }}
        env:
          FIREBASE_IOS_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_IOS_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_CREDENTIAL_JSON }}
          groups: testers
          releaseNotes: "${{ inputs.release_note || format('Prod Release Build #{0} ({1})', github.run_number, github.sha) }}"
          file: app/flutter/build/ios/ipa/mobile_ibs.ipa

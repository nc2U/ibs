name: "[Dev] Vue Build & Deploy"

on:
  push:
    paths:
      - "app/vue/**"
    branches: [ "develop" ]
  
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# job은 사용자가 정한 플랫폼을 통해 steps 라는 일련의 과정을 실행.
# 여러 개의 job 을 사용할 수 있으며, 여러 개의 job 을 사용할 때는 서로 정보도 교환 가능.
# 각각 독립적으로도 실행 가능.
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    
    steps:
      # 레파지터리 체크 아웃
      - name: Check out source code
        uses: actions/checkout@v4
        with:
          ref: 'develop'
      
      # Node.js 사용
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      
      # pnpm use
      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 11
          run_install: false

      # pnpm store 경로 설정
      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      # node_modules 대신 pnpm store 캐싱
      - name: Cache pnpm store
        uses: actions/cache@v4
        id: cache_vue
        with:
          path: ${{ env.STORE_PATH }}  # ✅ store 캐싱
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('app/vue/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-
      
      # Disable pnpm minimumReleaseAge policy
      - name: Disable pnpm minimumReleaseAge policy
        run: cd app/vue && pnpm config set minimum-release-age 0

      # node_modules 변화기 있으면 빌드
      - name: Install Dependencies
        run: cd app/vue && pnpm i --no-frozen-lockfile
      
      #      - run: pnpm lint
      #        # `if: ${{ always() }}`
      #        # 만약 `pnpm lint`라는 곳에서 에러가 났을 경우 이후 build를 실행하지 않고 해당 workflow가 종료됨.
      #        # `if: ${{ always() }}`라는 문법을 사용 시 `pnpm lint`라는 곳에서 에러가 나도
      #        # 이후의 build까지 다 실행을 해보고 난 뒤 종료 하므로 모든 테스트 스크립트에 `if: ${{ always() }}`를 붙임.
      #        if: ${{ always() }}
      
      # setup and lint 에러가 없으면 빌드
      - name: Build the Source Code
        env:
          NODE_ENV: development
          BUILD_TIMESTAMP: ${{ github.run_number }}_${{ github.sha }}
          BUILD_DIR: ../django/static/dist_${{ github.run_number }}_${{ github.sha }}
        run: |
          cd app/vue
          echo "Building to: $BUILD_DIR"
          pnpm build

      # 배포 메타데이터 생성
      - name: Create deployment metadata
        env:
          BUILD_TIMESTAMP: ${{ github.run_number }}_${{ github.sha }}
        run: |
          cd app/django/static
          echo "{
            \"build_time\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",
            \"git_sha\": \"${{ github.sha }}\",
            \"git_branch\": \"${{ github.ref_name }}\",
            \"build_number\": \"${{ github.run_number }}\",
            \"deployer\": \"${{ github.actor }}\"
          }" > dist_${BUILD_TIMESTAMP}/deploy.json

      # 빌드 검증
      - name: Verify Production Build
        env:
          BUILD_TIMESTAMP: ${{ github.run_number }}_${{ github.sha }}
        run: |
          cd app/django/static/dist_${BUILD_TIMESTAMP}

          echo "🔍 Verifying production build..."

          # index.html 존재 확인
          if [ ! -f "index.html" ]; then
            echo "❌ ERROR: index.html not found!"
            exit 1
          fi

          # base path 검증 (/static/dist 경로 사용 확인)
          if ! grep -q '/static/dist/assets/' index.html; then
            echo "❌ ERROR: Build base path incorrect! Expected '/static/dist/assets/'"
            echo "Found paths:"
            grep -o 'src="[^"]*"' index.html | head -5
            exit 1
          fi

          # console.log 제거 확인 (경고만)
          if find assets -name "*.js" -exec grep -l 'console\.log' {} \; 2>/dev/null | grep -q .; then
            echo "⚠️  WARNING: Console logs found in production build"
          fi

          # sourcemap 제외 확인 (경고만)
          if find assets -name "*.map" 2>/dev/null | grep -q .; then
            echo "⚠️  WARNING: Sourcemap files found in production build"
          fi

          echo "✅ Production build verification passed"
          echo "📊 Build stats:"
          echo "  - index.html: $(wc -c < index.html) bytes"
          echo "  - Total assets: $(find assets -type f | wc -l) files"
          echo "  - Total size: $(du -sh assets | cut -f1)"

      # 단위 테스트
      - name: Vue Unit Test using Vitest
        run: cd app/vue && pnpm test:unit

      # 새 빌드만 업로드 (전체 static이 아닌)
      - name: Upload new build to server
        env:
          BUILD_TIMESTAMP: ${{ github.run_number }}_${{ github.sha }}
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.CICD_HOST }}
          username: ${{ secrets.CICD_USER }}
          password: ${{ secrets.CICD_PASS }}
          source: 'app/django/static/dist_${{ github.run_number }}_${{ github.sha }}'
          target: ${{ secrets.CICD_PATH }}/dev/

      # 디버깅: 업로드된 위치 확인
      - name: Debug uploaded location
        env:
          BUILD_TIMESTAMP: ${{ github.run_number }}_${{ github.sha }}
        uses: garygrossgarten/github-action-ssh@release
        with:
          host: ${{ secrets.CICD_HOST }}
          username: ${{ secrets.CICD_USER }}
          password: ${{ secrets.CICD_PASS }}
          command: |
            echo "🔍 Searching for uploaded build..."
            find ${{ secrets.CICD_PATH }}/dev -name "dist_${{ github.run_number }}_*" -type d
            echo "---"
            echo "Expected: ${{ secrets.CICD_PATH }}/dev/app/django/static/dist_${{ github.run_number }}_${{ github.sha }}"

      # SCP 후 파일 무결성 검증
      - name: Verify upload integrity
        env:
          BUILD_TIMESTAMP: ${{ github.run_number }}_${{ github.sha }}
        uses: garygrossgarten/github-action-ssh@release
        with:
          host: ${{ secrets.CICD_HOST }}
          username: ${{ secrets.CICD_USER }}
          password: ${{ secrets.CICD_PASS }}
          command: |
            set -e
            cd ${{ secrets.CICD_PATH }}/dev/app/django/static
            NEW_BUILD="dist_${{ github.run_number }}_${{ github.sha }}"

            echo "🔍 Verifying uploaded files for: $NEW_BUILD"

            test -d "$NEW_BUILD" || { echo "❌ ERROR: Build directory not found"; exit 1; }
            test -f "$NEW_BUILD/index.html" || { echo "❌ ERROR: index.html not uploaded"; exit 1; }
            test -d "$NEW_BUILD/assets" || { echo "❌ ERROR: assets directory not uploaded"; exit 1; }

            ASSET_COUNT=$(find "$NEW_BUILD/assets" -type f 2>/dev/null | wc -l)
            [ "$ASSET_COUNT" -ge 10 ] || { echo "❌ ERROR: Too few assets ($ASSET_COUNT)"; exit 1; }

            MAIN_JS=$(grep -o 'assets/index-[^"]*\.js' "$NEW_BUILD/index.html" 2>/dev/null | head -1)
            if [ -n "$MAIN_JS" ]; then
              if [ ! -f "$NEW_BUILD/$MAIN_JS" ]; then
                echo "❌ ERROR: Referenced main JS missing: $MAIN_JS"
                exit 1
              fi
            else
              echo "⚠️  WARNING: Could not detect main JS reference in index.html"
            fi

            CSS_COUNT=$(find "$NEW_BUILD/assets" -name "*.css" 2>/dev/null | wc -l)
            if [ "$CSS_COUNT" -eq 0 ]; then
              echo "❌ ERROR: No CSS files found in deployment!"
              exit 1
            fi

            echo "✅ Upload integrity verified"
            echo "  ✓ Main JS: $MAIN_JS"
            echo "  ✓ CSS files: $CSS_COUNT"
            echo "  ✓ Total assets: $ASSET_COUNT files"

      # 원자적 배포 (Symlink Swap)
      - name: Atomic deployment with symlink swap
        env:
          BUILD_TIMESTAMP: ${{ github.run_number }}_${{ github.sha }}
        uses: garygrossgarten/github-action-ssh@release
        with:
          host: ${{ secrets.CICD_HOST }}
          username: ${{ secrets.CICD_USER }}
          password: ${{ secrets.CICD_PASS }}
          command: |
            cd ${{ secrets.CICD_PATH }}/dev/app/django/static

            NEW_BUILD="dist_${{ github.run_number }}_${{ github.sha }}"

            echo "📦 Deploying: $NEW_BUILD"

            # 1. 새 빌드 디렉터리 존재 검증
            if [ ! -d "$NEW_BUILD" ]; then
              echo "❌ ERROR: Build directory not found: $NEW_BUILD"
              exit 1
            fi

            # 2. 이전 활성 빌드 기록 (안전 롤백용)
            PREVIOUS_BUILD=""
            if [ -L "dist" ]; then
              PREVIOUS_BUILD=$(readlink dist)
              echo "Previous active build: $PREVIOUS_BUILD"
            fi

            # 3. 진정한 원자적 심볼릭 링크 교체 (Atomic Symlink Swap - Zero Downtime)
            ln -sfn "$NEW_BUILD" dist

            # 4. 교체 무결성 검증
            CURRENT_LINK=$(readlink dist 2>/dev/null || true)
            if [ "$CURRENT_LINK" != "$NEW_BUILD" ] || [ ! -d "dist" ]; then
              echo "❌ ERROR: Symlink swap failed or target broken! Attempting rollback..."
              if [ -n "$PREVIOUS_BUILD" ] && [ -d "$PREVIOUS_BUILD" ]; then
                ln -sfn "$PREVIOUS_BUILD" dist
                echo "⏪ Rolled back to previous build: $PREVIOUS_BUILD"
              fi
              exit 1
            fi

            echo "✅ Symlink atomically updated & verified: dist -> $CURRENT_LINK"
            echo "✅ Deployment complete! (old build cleanup will run after pod rollout)"


      # NFS 동기화 대기
      - name: Wait for NFS sync
        run: |
          echo "⏳ Waiting for NFS synchronization..."
          sleep 5
          echo "✅ NFS sync complete"

      # 배포 검증 (파일 무결성 확인)
      - name: Verify deployment integrity
        uses: garygrossgarten/github-action-ssh@release
        with:
          host: ${{ secrets.CICD_HOST }}
          username: ${{ secrets.CICD_USER }}
          password: ${{ secrets.CICD_PASS }}
          command: |
            cd ${{ secrets.CICD_PATH }}/dev/app/django/static

            echo "🔍 Verifying deployment integrity..."

            if [ ! -f "dist/index.html" ]; then
              echo "❌ Deployment failed: index.html not found"
              exit 1
            fi

            if [ ! -d "dist/assets" ]; then
              echo "❌ Deployment failed: assets directory not found"
              exit 1
            fi

            MAIN_JS=$(grep -o 'assets/index-[^"]*\.js' dist/index.html 2>/dev/null | head -1)
            if [ -n "$MAIN_JS" ]; then
              if [ ! -f "dist/$MAIN_JS" ]; then
                echo "❌ Deployment failed: Referenced main JS missing: $MAIN_JS"
                echo "Available index JS files:"
                ls -lh dist/assets/index-*.js 2>/dev/null || echo "  None found!"
                exit 1
              fi
              echo "  ✓ Main JS exists: $MAIN_JS"
            else
              echo "⚠️  WARNING: Could not detect main JS reference in index.html"
            fi

            CSS_COUNT=$(find dist/assets -name "*.css" 2>/dev/null | wc -l)
            if [ "$CSS_COUNT" -eq 0 ]; then
              echo "❌ ERROR: No CSS files found in deployment!"
              exit 1
            fi
            echo "  ✓ CSS files: $CSS_COUNT"

            TOTAL_ASSETS=$(find dist/assets -type f 2>/dev/null | wc -l)
            echo "  ✓ Total assets: $TOTAL_ASSETS"

            echo ""
            echo "✅ Deployment integrity verified"
            echo "📊 Deployment info:"
            if [ -f "dist/deploy.json" ]; then
              cat dist/deploy.json
            fi
            echo ""
            echo "Active build: $(readlink dist)"

      # Kubernetes Context 설정 (공식 액션 사용)
      - name: Set Kubernetes Context
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
          context: default

      - name: Verify cluster connection
        run: kubectl get nodes

      # Kubernetes Pod 재시작 (Django 템플릿 캐시 클리어)
      # ⚠️ 순서 중요: Nginx 완전 교체 후 Web 재시작
      #   동시 재시작 시 old Web(구 index.html) + new Nginx(신 dist) 조합 → 404 발생
      - name: Restart web and nginx pods
        run: |
          echo "🔄 [1/2] Restarting Nginx pods (new dist mount)..."
          kubectl rollout restart deployment/nginx -n ibs-dev
          kubectl rollout status deployment/nginx -n ibs-dev --timeout=120s
          echo "✅ Nginx rollout complete — all pods now mount new dist"

          echo "🔄 [2/2] Restarting Web pods (new index.html)..."
          kubectl rollout restart deployment/web -n ibs-dev
          kubectl rollout status deployment/web -n ibs-dev --timeout=120s
          echo "✅ Web rollout complete"

          echo "✅ All pods restarted successfully"

      # Pod 롤아웃 완료 후 구 빌드 정리
      # ⚠️ 반드시 pod rollout 이후에 실행해야 함:
      #   구 Pod의 subPath bind mount가 삭제된 디렉터리를 가리키면 NFS stale handle → 500 발생
      - name: Cleanup old builds (after pod rollout)
        uses: garygrossgarten/github-action-ssh@release
        with:
          host: ${{ secrets.CICD_HOST }}
          username: ${{ secrets.CICD_USER }}
          password: ${{ secrets.CICD_PASS }}
          command: |
            cd ${{ secrets.CICD_PATH }}/dev/app/django/static

            CURRENT_LINK=$(readlink dist 2>/dev/null || true)
            echo "🧹 Cleaning old builds (keeping 3 most recent, active: $CURRENT_LINK)..."

            ALL_BUILDS=$(ls -dt dist_* 2>/dev/null || true)
            BUILD_COUNT=$(echo "$ALL_BUILDS" | grep -v '^$' | wc -l)

            if [ "$BUILD_COUNT" -gt 3 ]; then
              echo "$ALL_BUILDS" | tail -n +4 | while read -r OLD_BUILD; do
                if [ "$OLD_BUILD" != "$CURRENT_LINK" ]; then
                  echo "  Removing old build: $OLD_BUILD"
                  rm -rf "$OLD_BUILD"
                else
                  echo "  Skipping active build: $OLD_BUILD"
                fi
              done
            else
              echo "  Build count ($BUILD_COUNT) within limit, no cleanup needed"
            fi

            echo "✅ Cleanup complete"

      # slack --> notification
      - name: Send slack when failed
        if: ${{ failure() }}                    # 실패했을 때 실행
        uses: ./.github/actions/slack-notify    # 직접 '만든' Action이므로 uses 키워드를 이용해서 아래 경로를 입력해줍니다.
        with:
          slack_incoming_url: ${{ secrets.SLACK_INCOMING_URL }}

      - name: Send slack if completed
        if: ${{ success() }}                    # 성공할 때만 실행
        uses: ./.github/actions/slack-notify
        with:
          status: success   # status input은 받는 쪽에서 default 값을 정해놨기 때문에 success일 때만 전달.
          slack_incoming_url: ${{ secrets.SLACK_INCOMING_URL }}

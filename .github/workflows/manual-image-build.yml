name: "[Manual] Docker(Django) Build & Deploy"

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

# 수동 빌드 동시 실행 방지
concurrency:
  group: manual-image-build-${{ inputs.target_env }}
  cancel-in-progress: false

jobs:
  build_and_deploy:
    name: Image Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name:  Set environment variables & Prepare requirements
        run: |
          if [ "${{ inputs.target_env }}" = "prod" ]; then
            echo "ENV_NAMESPACE=ibs-prod" >> $GITHUB_ENV
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
            echo "SHA_TAG=${{ github.sha }}" >> $GITHUB_ENV
            echo "DEPLOY_SCRIPT=prod-deploy.sh" >> $GITHUB_ENV
          else
            echo "ENV_NAMESPACE=ibs-dev" >> $GITHUB_ENV
            echo "IMAGE_TAG=dev-latest" >> $GITHUB_ENV
            echo "SHA_TAG=dev-${{ github.sha }}" >> $GITHUB_ENV
            echo "DEPLOY_SCRIPT=dev-deploy.sh" >> $GITHUB_ENV
          
            # Dev 환경: ci-verify 및 Prod 와 동일하게 고정된 requirements.txt 버전 사용
            echo "ℹ️ Using pinned requirements.txt for dev build (matching ci-verify and prod)."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Force Build and Push Django Docker Image (No Cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/docker/python/Dockerfile
          push: true
          no-cache: true
          tags: |
            nc2u/django:${{ env.IMAGE_TAG }}
            nc2u/django:${{ env.SHA_TAG }}

      - name: Deploy to Kubernetes & Rollout Restart Pods
        uses: garygrossgarten/github-action-ssh@release
        with:
          host: ${{ secrets.CICD_HOST }}
          username: ${{ secrets.CICD_USER }}
          password: ${{ secrets.CICD_PASS }}
          command: |
            set -e
            export KUBECONFIG=$HOME/.kube/config
            cd ${{ secrets.CICD_PATH }}/${{ inputs.target_env }}/deploy/helm/scripts
            sh ${{ env.DEPLOY_SCRIPT }}
            kubectl rollout restart deployment/web -n ${{ env.ENV_NAMESPACE }}
            kubectl rollout restart deployment/web-celery -n ${{ env.ENV_NAMESPACE }}
            kubectl rollout restart deployment/nginx -n ${{ env.ENV_NAMESPACE }}
            echo "⏳ Waiting for deployments to complete rollout status..."
            kubectl rollout status deployment/web -n ${{ env.ENV_NAMESPACE }} --timeout=180s
            kubectl rollout status deployment/web-celery -n ${{ env.ENV_NAMESPACE }} --timeout=180s
            kubectl rollout status deployment/nginx -n ${{ env.ENV_NAMESPACE }} --timeout=180s
            echo "✅ Force Rebuild & Rollout Restart Completed Successfully!"

      - name: Send Slack Notification when failed
        if: ${{ failure() }}
        uses: ./.github/actions/slack-notify
        with:
          slack_incoming_url: ${{ secrets.SLACK_INCOMING_URL }}

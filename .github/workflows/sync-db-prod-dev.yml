name: "Sync Database & Media Prod to Dev"

on:
  schedule:
    - cron: "0 17 * * 6" # UTC 기준으로 매주 토요일 오후 5시 (KST 일요일 새벽 2시) 마다 실행
  
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  sync:
    name: Sync Prod to Dev
    runs-on: ubuntu-latest
    
    steps:
      # 로컬 커스텀 액션 사용을 위해 코드 체크아웃 필수
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Sync S3 DB Backup & Media Files (Production -> Dev)
      - name: Mirror S3 DB Backup & Media Files (Production -> Dev)
        uses: garygrossgarten/github-action-ssh@release
        with:
          host: ${{ secrets.NFS_HOST }}
          username: ${{ secrets.NFS_USER }}
          password: ${{ secrets.NFS_PASS }}
          command: |
            set -euo pipefail
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin
            # MC_HOST_* 환경변수를 사용하여 쉘 인용부호/명령행 노출 방지
            NFS_USER_VAL=$(cat <<'EOF_USER'
            ${{ secrets.NFS_USER }}
            EOF_USER
            )
            NFS_PASS_VAL=$(cat <<'EOF_PASS'
            ${{ secrets.NFS_PASS }}
            EOF_PASS
            )
            mc alias set minio-s3 https://s3.dyibs.com "$NFS_USER_VAL" "$NFS_PASS_VAL"

            echo "🔄 Mirroring S3 DB Backup buckets (postgres-backup -> postgres-backup-dev)..."
            mc mb minio-s3/postgres-backup-dev --ignore-existing
            mc mirror minio-s3/postgres-backup minio-s3/postgres-backup-dev --overwrite
            echo "✅ S3 DB Backup sync completed successfully"

            echo "🔄 Mirroring S3 media buckets (ibs-media -> ibs-media-dev)..."
            mc mb minio-s3/ibs-media-dev --ignore-existing
            mc mirror minio-s3/ibs-media minio-s3/ibs-media-dev --overwrite --remove
            echo "✅ S3 media sync completed successfully"

      # 2. CloudNativePG Restore DB to Dev environment & purge Prod RRN ciphertexts
      - name: Restore DB to Dev environment
        uses: garygrossgarten/github-action-ssh@release
        with:
          host: ${{ secrets.CICD_HOST }}
          username: ${{ secrets.CICD_USER }}
          password: ${{ secrets.CICD_PASS }}
          command: |
            set -euo pipefail
            export KUBECONFIG=$HOME/.kube/config
            cd ${{ secrets.CICD_PATH }}/dev/deploy/helm/scripts

            echo "Restoring production data to dev environment..."
            bash manual-s3-restore.sh dev "" restore --auto
            echo "✅ Database restore to dev completed successfully"

            echo "🧹 Sanitizing encrypted RRN table in ibs-dev (removing prod ciphertexts)..."
            PRIMARY_POD=$(kubectl get pod -n ibs-dev -l "cnpg.io/cluster=postgres,role=primary" -o name 2>/dev/null | head -1 || true)
            if [ -n "$PRIMARY_POD" ]; then
              kubectl exec -n ibs-dev "$PRIMARY_POD" -c postgres -- psql -U postgres -d ibs -c \
                "DO \$\$ BEGIN IF to_regclass('ibs.contract_contractor_sensitive_info') IS NOT NULL THEN TRUNCATE TABLE ibs.contract_contractor_sensitive_info; END IF; END \$\$;"
              echo "✅ Dev RRN sanitization completed"
            fi

      # 4. Slack notification on failure
      - name: Send Slack Notification on Failure
        if: ${{ failure() }}
        uses: ./.github/actions/slack-notify
        with:
          slack_incoming_url: ${{ secrets.SLACK_INCOMING_URL }}

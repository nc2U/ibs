name: "Sync Database & Media Prod to Dev"

on:
  schedule:
    - cron: "0 17 * * 6" # UTC 기준으로 매주 토요일 오후 5시 (KST 일요일 새벽 2시) 마다 실행
  
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  sync:
    name: Sync Prod to Dev
    runs-on: ubuntu-latest
    
    steps:
      # 로컬 커스텀 액션 사용을 위해 코드 체크아웃 필수
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Sync S3 DB Backup (postgres-backup -> postgres-backup-dev)
      - name: Mirror S3 DB Backup (Production -> Dev)
        uses: garygrossgarten/github-action-ssh@release
        with:
          host: ${{ secrets.NFS_HOST }}
          username: ${{ secrets.NFS_USER }}
          password: ${{ secrets.NFS_PASS }}
          command: |
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin
            echo "🔄 Mirroring S3 DB Backup buckets (postgres-backup -> postgres-backup-dev)..."
            mc alias set minio-s3 https://s3.dyibs.com ${{ secrets.NFS_USER }} '${{ secrets.NFS_PASS }}'
            mc mb minio-s3/postgres-backup-dev --ignore-existing
            mc mirror minio-s3/postgres-backup minio-s3/postgres-backup-dev --overwrite
            echo "✅ S3 DB Backup sync completed successfully"

      # 2. Sync S3 Media Files (ibs-media -> ibs-media-dev)
      - name: Mirror S3 Media Files (Production -> Dev)
        uses: garygrossgarten/github-action-ssh@release
        with:
          host: ${{ secrets.NFS_HOST }}
          username: ${{ secrets.NFS_USER }}
          password: ${{ secrets.NFS_PASS }}
          command: |
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin
            echo "🔄 Mirroring S3 media buckets (ibs-media -> ibs-media-dev)..."
            mc alias set minio-s3 https://s3.dyibs.com ${{ secrets.NFS_USER }} '${{ secrets.NFS_PASS }}'
            mc mb minio-s3/ibs-media-dev --ignore-existing
            mc mirror minio-s3/ibs-media minio-s3/ibs-media-dev --overwrite --remove
            echo "✅ S3 media sync completed successfully"

      # 3. CloudNativePG Restore DB to Dev environment
      - name: Restore DB to Dev environment
        uses: garygrossgarten/github-action-ssh@release
        with:
          host: ${{ secrets.CICD_HOST }}
          username: ${{ secrets.CICD_USER }}
          password: ${{ secrets.CICD_PASS }}
          command: |
            export KUBECONFIG=$HOME/.kube/config
            cd ${{ secrets.CICD_PATH }}/dev/deploy/helm/scripts

            echo "Restoring production data to dev environment..."
            sh manual-restore.sh dev --auto --direct

            if [ $? -eq 0 ]; then
              echo "✅ Database restore to dev completed successfully"
            else
              echo "❌ Database restore to dev failed"
              exit 1
            fi

      # 4. Slack notification on failure
      - name: Send Slack Notification on Failure
        if: ${{ failure() }}
        uses: ./.github/actions/slack-notify
        with:
          slack_incoming_url: ${{ secrets.SLACK_INCOMING_URL }}

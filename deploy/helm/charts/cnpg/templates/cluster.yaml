{{- if .Values.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "cnpg.clusterName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cnpg.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  # Lookup existing cluster to prevent field-manager conflict on spec.instances across manual restores / helm upgrades
  {{- $existingCluster := lookup "postgresql.cnpg.io/v1" "Cluster" .Release.Namespace (include "cnpg.clusterName" .) }}
  # Number of instances (primary + replicas)
  instances: {{ if and $existingCluster $existingCluster.spec $existingCluster.spec.instances }}{{ $existingCluster.spec.instances }}{{ else }}{{ .Values.replication.instances | default 2 }}{{ end }}

  # PostgreSQL image
  imageName: {{ include "cnpg.image" . }}
  {{- with .Values.image.pullPolicy }}
  imagePullPolicy: {{ . }}
  {{- end }}

  # PostgreSQL user/group IDs (official ghcr.io/cloudnative-pg/postgresql image uses 26:26)
  postgresUID: 26
  postgresGID: 26

  # Primary update strategy
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover

  # Lookup existing cluster to preserve live bootstrap configuration across upgrades
  {{- $existingCluster := lookup "postgresql.cnpg.io/v1" "Cluster" .Release.Namespace (include "cnpg.clusterName" .) }}

  # Bootstrap configuration
  bootstrap:
    {{- if and $existingCluster $existingCluster.spec $existingCluster.spec.bootstrap }}
    # Preserve live cluster bootstrap configuration to prevent CNPG operator webhook conflict
    {{- toYaml $existingCluster.spec.bootstrap | nindent 4 }}
    {{- else if eq .Values.bootstrap.method "pg_upgrade" }}
    # Major version upgrade using pg_upgrade
    pg_upgrade:
      database: {{ include "cnpg.database" . }}
      owner: {{ include "cnpg.username" . }}
      secret:
        name: {{ include "cnpg.fullname" . }}-app
      {{- if .Values.bootstrap.pg_upgrade.sourceCluster }}
      source:
        clusterName: {{ .Values.bootstrap.pg_upgrade.sourceCluster }}
      {{- end }}
    {{- else if eq .Values.bootstrap.method "recovery" }}
    # Restore/Recovery from external S3 backup
    recovery:
      source: {{ .Values.bootstrap.recovery.source | default "postgres-s3" }}
      database: {{ include "cnpg.database" . }}
      owner: {{ include "cnpg.username" . }}
      secret:
        name: {{ include "cnpg.fullname" . }}-app
      {{- with .Values.bootstrap.recovery.targetTime }}
      recoveryTarget:
        targetTime: {{ . | quote }}
      {{- end }}
    {{- else }}
    # Initialize a new cluster
    initdb:
      database: {{ include "cnpg.database" . }}
      owner: {{ include "cnpg.username" . }}
      {{- with .Values.bootstrap.initdb.encoding }}
      encoding: {{ . }}
      {{- end }}
      {{- with .Values.bootstrap.initdb.localeCollate }}
      localeCollate: {{ . }}
      {{- end }}
      {{- with .Values.bootstrap.initdb.localeCType }}
      localeCType: {{ . }}
      {{- end }}
      {{- if .Values.bootstrap.initdb.postInitSQL }}
      postInitSQL:
        {{- toYaml .Values.bootstrap.initdb.postInitSQL | nindent 8 }}
      {{- end }}
      {{- if .Values.bootstrap.initdb.postInitApplicationSQL }}
      postInitApplicationSQL:
        {{- toYaml .Values.bootstrap.initdb.postInitApplicationSQL | nindent 8 }}
      {{- else }}
      postInitApplicationSQL:
        {{- $dbUser := include "cnpg.username" . }}
        {{- $dbName := include "cnpg.database" . }}
        - "CREATE SCHEMA IF NOT EXISTS {{ $dbName }} AUTHORIZATION {{ $dbUser }};"
        - "ALTER SCHEMA {{ $dbName }} OWNER TO {{ $dbUser }};"
        - "ALTER USER {{ $dbUser }} WITH PASSWORD '{{ .Values.auth.password | default .Values.global.dbPassword | default "secret" }}';"
        - "GRANT ALL PRIVILEGES ON DATABASE {{ $dbName }} TO {{ $dbUser }};"
        - "GRANT ALL ON SCHEMA {{ $dbName }} TO {{ $dbUser }};"
        - "ALTER DEFAULT PRIVILEGES IN SCHEMA {{ $dbName }} GRANT ALL ON TABLES TO {{ $dbUser }};"
        - "ALTER DEFAULT PRIVILEGES IN SCHEMA {{ $dbName }} GRANT ALL ON SEQUENCES TO {{ $dbUser }};"
        - "ALTER DATABASE {{ $dbName }} SET search_path TO {{ $dbName }}, public;"
        - "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
      {{- end }}
    {{- end }}

  {{- if and $existingCluster $existingCluster.spec $existingCluster.spec.externalClusters }}
  externalClusters:
    {{- toYaml $existingCluster.spec.externalClusters | nindent 4 }}
  {{- else if .Values.externalClusters }}
  # External Clusters configuration (e.g. S3 restore sources)
  externalClusters:
    {{- toYaml .Values.externalClusters | nindent 4 }}
  {{- end }}



  # Storage configuration
  storage:
    {{- with .Values.storage.storageClass }}
    storageClass: {{ . }}
    {{- end }}
    size: {{ .Values.storage.size | default "1Gi" }}
    pvcTemplate:
      accessModes:
        - ReadWriteOnce
    # NOTE: CNPG 1.27.1 doesn't support persistentVolumeClaimPolicy
    # Use preserve-pvcs.sh script before helm uninstallation to remove ownerReferences

  # Replication configuration
  {{- if gt (int .Values.replication.instances) 1 }}
  minSyncReplicas: {{ .Values.replication.minSyncReplicas | default 0 }}
  maxSyncReplicas: {{ .Values.replication.maxSyncReplicas | default 0 }}
  {{- end }}

  # PostgreSQL configuration
  postgresql:
    parameters:
      {{- if .Values.postgresql.parameters }}
      {{- range $key, $value := .Values.postgresql.parameters }}
      {{ $key }}: {{ $value | quote }}
      {{- end }}
      {{- end }}
      {{- if .Values.additionalConfig }}
      {{- range $key, $value := .Values.additionalConfig }}
      {{ $key }}: {{ $value | quote }}
      {{- end }}
      {{- end }}
    {{- if .Values.postgresql.pg_hba }}
    pg_hba:
      {{- toYaml .Values.postgresql.pg_hba | nindent 6 }}
    {{- else }}
    pg_hba:
      # Allow all connections with SCRAM-SHA-256 authentication
      - host all all all scram-sha-256
    {{- end }}

  # Resource limits
  {{- with .Values.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  # Environment variables (e.g., TZ for timezone)
  {{- with .Values.env }}
  env:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  # Affinity configuration
  {{- if .Values.affinity }}
  affinity:
    {{- if .Values.affinity.podAntiAffinityType }}
    podAntiAffinityType: {{ .Values.affinity.podAntiAffinityType }}
    {{- end }}
    {{- with .Values.affinity.nodeAffinity }}
    nodeAffinity:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}

  # Tolerations
  {{- with .Values.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  # Node selector
  {{- with .Values.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  # Backup configuration using CNPG in-tree Barman Cloud (S3)
  {{- if and .Values.backup.enabled .Values.backup.s3.enabled }}
  backup:
    barmanObjectStore:
      destinationPath: {{ include "cnpg.backupDestination" . | quote }}
      {{- with .Values.backup.s3.endpoint }}
      endpointURL: {{ . | quote }}
      {{- end }}
      s3Credentials:
        accessKeyId:
          name: {{ printf "%s-backup-s3" (include "cnpg.fullname" .) | quote }}
          key: "ACCESS_KEY_ID"
        secretAccessKey:
          name: {{ printf "%s-backup-s3" (include "cnpg.fullname" .) | quote }}
          key: "ACCESS_SECRET_KEY"
      wal:
        compression: {{ .Values.backup.wal.compression | default "gzip" | quote }}
        {{- with .Values.backup.wal.maxParallel }}
        maxParallel: {{ . }}
        {{- end }}
      data:
        compression: {{ .Values.backup.data.compression | default "gzip" | quote }}
        {{- with .Values.backup.data.jobs }}
        jobs: {{ . }}
        {{- end }}
  {{- end }}

  # Monitoring
  {{- if .Values.monitoring.enabled }}
  monitoring:
    enablePodMonitor: true
    {{- with .Values.monitoring.customQueries }}
    customQueriesConfigMap:
      - name: {{ include "cnpg.fullname" . }}-monitoring
        key: custom-queries
    {{- end }}
  {{- end }}

  # Service account
  {{- if .Values.serviceAccount.create }}
  serviceAccountTemplate:
    metadata:
      name: {{ include "cnpg.serviceAccountName" . }}
      labels:
        {{- include "cnpg.labels" . | nindent 8 }}
      {{- with .Values.serviceAccount.annotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- end }}

  enablePDB: true  # 쿠버네티스 PodDisruptionBudget 활성화

  # Certificates (if enabled)
  {{- if .Values.certificates.enabled }}
  certificates:
    serverTLSSecret: {{ include "cnpg.fullname" . }}-server-cert
    serverCASecret: {{ include "cnpg.fullname" . }}-server-ca
    clientCASecret: {{ include "cnpg.fullname" . }}-client-ca
    replicationTLSSecret: {{ include "cnpg.fullname" . }}-replication-cert
  {{- end }}

  # Managed roles (if any)
  {{- with .Values.managedRoles }}
  managed:
    roles:
      {{- toYaml . | nindent 6 }}
  {{- end }}

{{- if and .Values.backup.enabled .Values.backup.schedule }}
---
# Scheduled Backup
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ include "cnpg.fullname" . }}-backup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cnpg.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  backupOwnerReference: self
  cluster:
    name: {{ include "cnpg.clusterName" . }}
  immediate: false
{{- end }}

{{- if .Values.pgbouncer.enabled }}
---
# PgBouncer Pooler
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: {{ include "cnpg.fullname" . }}-pooler
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cnpg.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  cluster:
    name: {{ include "cnpg.clusterName" . }}
  instances: {{ .Values.pgbouncer.instances | default 2 }}
  type: rw
  pgbouncer:
    poolMode: {{ .Values.pgbouncer.poolMode | default "transaction" }}
    parameters:
      {{- range $key, $value := .Values.pgbouncer.parameters }}
      {{ $key }}: {{ $value | quote }}
      {{- end }}
  monitoring:
    enablePodMonitor: {{ .Values.monitoring.enabled }}
{{- end }}
{{- end }}

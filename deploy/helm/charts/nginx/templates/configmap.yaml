apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nginx.fullname" . }}-config
data:
  {{- with .Values.imageConfigMaps }}
  NGINX.CONF: |
    user  nginx;
    worker_processes auto;

    error_log  /var/log/nginx/error.log notice;
    pid        /var/run/nginx.pid;

    events {
        worker_connections  {{ .workerConnections | default "1024" }};
    }

    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';

        access_log  /var/log/nginx/access.log  main;

        sendfile        on;
        #tcp_nopush     on;

        keepalive_timeout  {{ .keepaliveTimeout | default "65" }};
        client_max_body_size 100M;
        client_body_timeout 300s;
        send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 256k;

        gzip  on;

        include /etc/nginx/conf.d/upstream.conf;
        include /etc/nginx/conf.d/public.conf;
        include /etc/nginx/conf.d/log.conf;
    }
  LOG.CONF: |
    log_format json '{'
               '"time":"$time_iso8601",'
               '"remote_addr":"$remote_addr",'
               '"request":"$request",'
               '"request_method":"$request_method",'
               '"request_length":"$request_length",'
               '"request_uri":"$request_uri",'
               '"uri":"$uri",'
               '"query_string":"$query_string",'
               '"status":"$status",'
               '"bytes_sent":"$bytes_sent",'
               '"body_bytes_sent":"$body_bytes_sent",'
               '"referer":"$http_referer",'
               '"useragent":"$http_user_agent",'
               '"forwardedfor":"$http_x_forwarded_for",'
               '"request_time":"$request_time",'
               '"upstream_response_time":"$upstream_response_time"'
              '}';
  UPSTREAM.CONF: |
    upstream django {
        server web:8000;
    }
  {{- end }}
  MAINTENANCE.HTML: |
    <!DOCTYPE html>
    <html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>시스템 데이터 점검 안내 - IBS</title>
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
                background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
                color: #f8fafc;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 1.5rem;
            }
            .card {
                background: rgba(30, 41, 59, 0.7);
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 0.5rem;
                padding: 3rem 2.5rem;
                max-width: 500px;
                width: 100%;
                text-align: center;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            }
            .icon-wrapper {
                width: 80px;
                height: 80px;
                background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                margin: 0 auto 1.5rem auto;
                box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.5);
            }
            .icon-wrapper svg {
                width: 40px;
                height: 40px;
                fill: none;
                stroke: #ffffff;
                stroke-width: 2;
                stroke-linecap: round;
                stroke-linejoin: round;
            }
            h1 {
                font-size: 1.5rem;
                font-weight: 700;
                margin-bottom: 0.75rem;
                color: #ffffff;
                letter-spacing: -0.02em;
            }
            p {
                font-size: 0.95rem;
                color: #94a3b8;
                line-height: 1.6;
                margin-bottom: 1.5rem;
            }
            .time-box {
                background: rgba(15, 23, 42, 0.6);
                border: 1px dashed rgba(255, 255, 255, 0.15);
                border-radius: 0.3rem;
                padding: 0.85rem 1rem;
                margin-bottom: 1.75rem;
                font-size: 0.88rem;
                color: #cbd5e1;
            }
            .time-box strong {
                color: #60a5fa;
            }
            .status-badge {
                display: inline-flex;
                align-items: center;
                gap: 0.5rem;
                background: rgba(59, 130, 246, 0.1);
                border: 1px solid rgba(59, 130, 246, 0.2);
                padding: 0.55rem 1.5rem;
                border-radius: 9999px;
                font-size: 0.85rem;
                color: #a0ccff;
                font-weight: 180;
            }
            .pulse-dot {
                width: 9px;
                height: 9px;
                margin-right: 5px;
                background-color: #3b82f6;
                border-radius: 50%;
                box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7);
                animation: pulse 2s infinite;
            }
            @keyframes pulse {
                0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
                70% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
                100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
            }
        </style>
    </head>
    <body>
        <div class="card">
            <div class="icon-wrapper">
                <svg viewBox="0 0 24 24">
                    <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                    <path d="M3 3v5h5"/>
                    <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
                    <path d="M16 16h5v5"/>
                </svg>
            </div>
            <h1>시스템 점검 및 데이터 복구 중</h1>
            <p>안전한 데이터 최신화 및 시스템 점검 작업을 진행하고 있습니다.<br>작업이 완료되는 대로 서비스가 자동 정상화됩니다.</p>

            <div class="time-box">
                ⏱️ 예상 소요 시간: <strong>약 5 ~ 10분 내외</strong>
            </div>

            <div class="status-badge">
                <span class="pulse-dot"></span>
                <span>Database Recovery in Progress...</span>
            </div>
        </div>
    </body>
    </html>

  PUBLIC.CONF: |
    server {
        listen          {{ .Values.service.port | default "80" }} default_server;
        server_name     $host www.$host;
        charset         utf-8;

        client_max_body_size 100M;

        # 503 Service Unavailable (점검 모드) 발생 시에만 전용 점검 안내 페이지 표시
        error_page 503 @maintenance;
        location @maintenance {
            root /usr/share/nginx/html;
            rewrite ^(.*)$ /maintenance.html break;
        }

        location / {
            # /django/static/maintenance.flag 존재 시 503 점검 모드 전환
            if (-f /django/static/maintenance.flag) {
                return 503;
            }

            proxy_pass http://django;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeout configurations for heavy API requests
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_connect_timeout 300s;

            # SPA 메인 페이지 캐시 방지 (배포 시 브라우저 최신 화면 서빙 보장)
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;

            # CORS (에러 응답에도 적용)
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials true always;
        }

        # SSE (Server-Sent Events) 실시간 알림 스트림 전용 라우팅
        location ~ ^/api/v[0-9]+/notifications/stream/ {
            proxy_pass http://django;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE 스트리밍 필수 설정 (버퍼링 즉시 해제 및 24시간 타임아웃 유지)
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            chunked_transfer_encoding off;

            # 클라이언트 캐시 및 Nginx 압축 버퍼링 방지
            add_header Cache-Control "no-cache, no-transform" always;
            add_header X-Accel-Buffering "no" always;
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials true always;
        }

        location /nginx-healthz/ {
            access_log off;
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        location /static/ {
            alias /django/static/;

            # 404 예방을 위해 alias 하위 레벨 정돈 및 보안 헤더 설정
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location /media/ {
            alias /django/media/;
            expires 30d;
            add_header Cache-Control "public";
        }
    }

    server_tokens off;

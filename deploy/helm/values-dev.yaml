# Default values for IBS (dev mockup).
# This is a YAML-formatted mockup file for values-dev-custom.yaml.

global:
  appMode: dev
  dbType: "postgres"
  databaseName: "ibs"
  databaseUser: "ibs"
  dbPassword: "my-secret"
  cicdServerHost: "cicd-server-host"
  cicdPath: "/cicd-path" # cicd server path
  nfsServerHost: "nfs-server-host"
  nfsPath: "/nfs-path" # nfs volume path
  database:
    type: "postgres"
    cnpg:
      directConnection: true  # Enable direct primary pod connection for migrations

cnpg:
  enabled: true
  replication:
    instances: 1
  backup:
    enabled: true
    schedule: "0 0 2 * * *"
    retentionPolicy: "30d"
    s3:
      enabled: true
      bucket: "postgres-backup-dev-mock"
      region: "ap-northeast-2"
      endpoint: "http://192.168.0.100:9000"
      accessKeyId: "dev-user-mock"
      secretAccessKey: "dev-secret-password-mock"

web:
  image:
    tag: dev-latest  # Overridden by GitHub Actions with git SHA

  celery:
    replicaCount: 1

nginx:
  image:
    tag: "latest"

  # Django web image for init container (to copy static files)
  web:
    image:
      tag: dev-latest  # Overridden by GitHub Actions with git SHA

  service:
    port: 8881

  ingress:
    hosts:
      - host: my-dev-host.com # Host address
        paths:
          - path: /
            pathType: Prefix
      - host: my-dev-subhost.com # Host address
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: web-devbox-kr-cert
        hosts:
          - my-dev-host.com
          - my-dev-subhost.com
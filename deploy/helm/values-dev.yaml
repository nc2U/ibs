global:
  appMode: dev
  dbType: "postgres" # postgres | mariadb
  dbPassword: "my-secret"
  nfsServerHost: "nfs-server-host"
  nfsPath: "nfs-path" # nfs volume path
  cicdServerHost: "cicd-server-host"
  cicdPath: "cicd-path" # cicd server path
  database:
    type: "postgres"
    cnpg:
      directConnection: true  # Enable direct primary pod connection for migrations

# CloudNativePG 설정
cnpg:
  enabled: true
  replication:
    instances: 1
  backup:
    enabled: false
    s3:
      enabled: false
      bucket: "postgres-backup-dev-mock"
      region: "ap-northeast-2"
      endpoint: "http://192.168.0.100:9000"
      accessKeyId: "YOUR_DEV_ACCESS_KEY"
      secretAccessKey: "YOUR_DEV_SECRET_KEY"

web:
  imageConfigMaps:
    djangoSettingsModule: _config.settings
    awsStorageBucketName: "ibs-media-dev"
    awsS3EndpointUrl: "https://s3.dyibs.com"
    awsRegion: "ap-northeast-2"
    awsQuerystringExpire: "3600"
    imageSecrets:
      awsAccessKeyId: "austin"
      awsSecretAccessKey: '$Sc1965112'

  image:
    tag: dev-latest  # Overridden by GitHub Actions with git SHA

  celery:
    replicaCount: 1

nginx:
  image:
    tag: "latest"

  # Django web image for init container (to copy static files)
  web:
    image:
      tag: dev-latest  # Overridden by GitHub Actions with git SHA

  service:
    port: 8881

  ingress:
    hosts:
      - host: my-dev-host.com # Host address
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: web-devbox-kr-cert
        hosts:
          - my-dev-host.com
global:
  appMode: prod
  dbType: "postgres" # postgres | mariadb
  databaseName: "ibs"
  databaseUser: "ibs"
  dbPassword: "my-secret"
  nfsServerHost: "nfs-server-host"
  nfsPath: "nfs-path" # nfs volume path
  cicdServerHost: "cicd-server-host"
  cicdPath: "cicd-path" # cicd server path
  database:
    type: "postgres"
    cnpg:
      directConnection: true  # Enable direct primary pod connection for migrations

# CloudNativePG 설정
cnpg:
  enabled: true
  replication:
    instances: 3
  backup:
    enabled: true
    schedule: "0 0 2 * * *"
    retentionPolicy: "30d"
    nfs:
      enabled: true
      cronJobEnabled: false
    s3:
      enabled: true
      bucket: "postgres-backup-prod-mock"
      region: "ap-northeast-2"
      endpoint: "http://192.168.0.200:9000"
      accessKeyId: "YOUR_PROD_ACCESS_KEY"
      secretAccessKey: "YOUR_PROD_SECRET_KEY"

web:
  imageConfigMaps:
    djangoSettingsModule: _config.settings
    awsStorageBucketName: "ibs-media"
    awsS3EndpointUrl: "https://s3.dyibs.com"
    awsRegion: "ap-northeast-2"
    awsQuerystringExpire: "3600"
    imageSecrets:
      awsAccessKeyId: "austin"
      awsSecretAccessKey: '$Sc1965112'

  resources: # Web application resource configuration
    requests:
      cpu: 300m
      memory: 768Mi
    limits:
      cpu: 2000m
      memory: 3Gi

  celery: # Celery worker configuration
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1500m
        memory: 2Gi

redis:
  enabled: true
  replicaCount: 1
  persistence:
    enabled: true
    size: 2Gi

nginx:
  service:
    port: 8880

  ingress:
    hosts:
      - host: my-host.com # Host address
        paths: [{ path: "/", pathType: Prefix }]
    tls:
      - secretName: web-devbox-kr-cert
        hosts:
          - my-host.com

erpRedirect: # 추후 삭제
  enabled: true # 추후 삭제
# Default values for IBS (prod mockup).
# This is a YAML-formatted mockup file for values-prod-custom.yaml.

global:
  appMode: prod
  dbType: "postgres"
  databaseName: "ibs"
  databaseUser: "ibs"
  dbPassword: "my-secret"
  cicdServerHost: "cicd-server-host"
  cicdPath: "/cicd-path" # cicd server path
  nfsServerHost: "nfs-server-host"
  nfsPath: "/nfs-path" # nfs volume path
  database:
    pullPolicy: "Always"
    type: "postgres"
    cnpg:
      directConnection: true  # Enable direct primary pod connection for migrations

cnpg:
  enabled: true
  replication:
    instances: 3
  backup:
    enabled: true               # CNPG barmanObjectStore + ScheduledBackup 활성화
    schedule: "0 0 2 * * *"     # 매일 새벽 2시 (6필드 크론: 초 분 시 일 월 요일)
    retentionPolicy: "30d"      # 30일 보존
    nfs:
      enabled: true             # manual-backup.sh용 PV/PVC 유지
      cronJobEnabled: false     # S3 백업으로 대체, NFS CronJob 비활성화
    s3:
      enabled: true
      bucket: "postgres-backup-prod-mock"
      region: "ap-northeast-2"
      endpoint: "http://192.168.0.200:9000"
      accessKeyId: "YOUR_PROD_ACCESS_KEY"
      secretAccessKey: "YOUR_PROD_SECRET_KEY"

web:
  resources: # Web application resource configuration
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  celery: # Celery worker configuration
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        cpu: 1000m
        memory: 768Mi

redis:
  enabled: true
  replicaCount: 1
  persistence:
    enabled: true
    size: 2Gi

nginx:
  service:
    port: 8880

  ingress:
    hosts:
      - host: my-host.com # Host address
        paths: [{ path: "/", pathType: Prefix }]
      - host: my-subhost-1.com # Host address
        paths: [{ path: "/", pathType: Prefix }]
      - host: my-subhost-2.com # Host address
        paths: [{ path: "/", pathType: Prefix }]
    tls:
      - secretName: web-devbox-kr-cert
        hosts:
          - my-host.com
          - my-subhost-1.com
          - my-subhost-2.com
          - my-legacy-host.com # 추후 삭제

erpRedirect: # 추후 삭제
  enabled: true # 추후 삭제